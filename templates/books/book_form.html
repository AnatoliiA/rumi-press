{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
 <style>
        body {
            background-color:#8f979f;
        }
  </style>
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2>{{ title }}</h2>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="btn btn-primary">
                    Save
                </button>

                <a href="{% url 'books:book_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock content %}
